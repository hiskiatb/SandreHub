<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Mail Sumatera — Sales &amp; Distribution Sumatera</title>
<!-- Halaman pertama saat menu Smart Mail Sumatera (dulu Report Merge) dibuka: pilih Blast Email Report, Partner SDP, atau Partner MDI. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try { document.documentElement.setAttribute('data-theme', localStorage.getItem('rm-theme') || 'dark'); } catch (e) {}</script>
<link rel="stylesheet" href="/report-merge/rm-pages.css">
<script src="/report-merge/rm-shell.js"></script>
<!-- [SandraHub] Tema dashboard SandraHub (font & warna, gelap/terang ikut dashboard). Hanya CSS. -->
<link rel="stylesheet" href="/report-merge/rm-sandra-theme.css">
</head>
<body>
<div id="rmTopbar"></div>

<div class="wrap">
  <div class="home-hero">
    <!-- Branding Smart Mail Sumatera (dipindah dari header halaman Partner SDP) -->
    <svg class="sms-brand" viewBox="0 0 530 110" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SMS Automation Transform — Smart Mail Sumatera">
      <g transform="translate(30, 15)">
        <path d="M0 10 L25 40 L0 70" stroke="#32BCAD" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M25 10 L50 40 L25 70" stroke="#FFCB05" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M50 10 L75 40 L50 70" stroke="#EC008C" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text class="sms-ink" x="135" y="48" font-weight="900" font-size="38" letter-spacing="-1">SMS</text>
      <text x="220" y="47" font-weight="600" font-size="18" fill="#32BCAD" letter-spacing="1">Automation Transform</text>
      <text class="sms-ink" x="135" y="75" font-weight="700" font-size="22">Smart Mail Sumatera</text>
      <rect class="sms-line" x="137" y="90" width="370" height="3" rx="1.5" />
      <rect x="137" y="90" width="70" height="3" fill="#ED1C24" rx="1.5" />
    </svg>
    <h1>Mau kirim apa hari ini?</h1>
    <p>Pilih salah satu menu. Untuk kembali ke halaman ini, klik tombol ← Kembali (Blast Email Report / Performance Report) atau ☰ Pilih menu (Partner SDP / MDI).</p>
  </div>

  <div class="home-grid">
    <button class="menu-card" type="button" data-open="email" style="--accent:var(--ioh-teal)">
      <div class="ico" data-icon="email"></div>
      <h3>Blast Email Report</h3>
      <p>Ubah satu file Excel laporan jadi banyak email terpisah. Tiap penerima dapat email berisi tabel rincian miliknya sendiri.</p>
      <ul>
        <li>Upload 1 Excel laporan</li>
        <li>Atur pengelompokan &amp; narasi email</li>
        <li>Preview, lalu kirim</li>
      </ul>
      <div class="tags"><span class="badge">LAPORAN</span><span class="badge">TABEL DI BADAN EMAIL</span></div>
      <div class="go">Buka Blast Email Report →</div>
    </button>

    <button class="menu-card" type="button" data-open="sdp" style="--accent:var(--ioh-red)">
      <div class="ico" data-icon="sdp"></div>
      <h3>Partner SDP</h3>
      <p>Kirim surat PDF untuk SDP &amp; 3KIOSK (Sales Support, Target KPI, OTF, Champions, Addition/Deduction, dll). Satu email per ID mitra.</p>
      <ul>
        <li>Upload Excel data mitra</li>
        <li>Upload PDF surat (per mitra, atau 1 PDF untuk semua)</li>
        <li>Cek pencocokan, lalu kirim</li>
      </ul>
      <div class="tags"><span class="badge">SDP / KIOSK</span><span class="badge">1 EMAIL PER ID</span></div>
      <div class="go">Buka Partner SDP →</div>
    </button>

    <button class="menu-card" type="button" data-open="mdi" style="--accent:var(--ioh-pink)">
      <div class="ico" data-icon="mdi"></div>
      <h3>Partner MDI</h3>
      <p>Kirim Surat Pemberitahuan Imbalan Jasa + BAST untuk Mitra Pengelola Cluster. Satu email per partner + type, berisi 2 lampiran.</p>
      <ul>
        <li>Upload Excel data partner</li>
        <li>Upload PDF Surat dan PDF BAST</li>
        <li>Cek pencocokan, lalu kirim</li>
      </ul>
      <div class="tags"><span class="badge">MDI / MPC</span><span class="badge">SURAT + BAST</span></div>
      <div class="go">Buka Partner MDI →</div>
    </button>
    <button class="menu-card" type="button" data-open="performance" style="--accent:#F7941D">
      <div class="ico" data-icon="performance"></div>
      <h3>Performance Report</h3>
      <p>Kirim laporan performa ke Internal Sales, MDI, dan SDP. Tiap orang/partner dapat email berisi tabel performanya sendiri, To &amp; Cc dari Daftar Penerima.</p>
      <ul>
        <li>Upload Excel performa (sheet Internal Sales / MDI / SDP)</li>
        <li>Cocokkan dengan Daftar Penerima</li>
        <li>Preview, lalu kirim</li>
      </ul>
      <div class="tags"><span class="badge">PERFORMA</span><span class="badge">TO &amp; CC TERSIMPAN</span></div>
      <div class="go">Buka Performance Report →</div>
    </button>
  </div>

  <div class="home-foot">Partner SDP dan Partner MDI dipindahkan dari aplikasi Smart Mail Sumatera.</div>
</div>

<script>
  document.querySelectorAll('[data-icon]').forEach(function (el) { el.innerHTML = RmShell.icon(el.dataset.icon, 52); });
  RmShell.topbar('home', 'Smart Mail Sumatera — pilih menu', false);
  document.querySelectorAll('[data-open]').forEach(function (b) {
    b.addEventListener('click', function () { RmShell.buka(b.dataset.open); });
  });
</script>
</body>
</html>
