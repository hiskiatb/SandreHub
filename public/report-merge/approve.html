<!DOCTYPE html>
<html lang="id">
<head>
<script>
  // Shim integrasi SandraHub — TIDAK mengubah satu baris pun logika app
  // aslinya (index.html/approve.html persis sama). Cuma membungkus
  // window.fetch supaya:
  //   1) semua panggilan '/api/...' diarahkan ke '/api/report-merge/...'
  //      (endpoint backend Report Merge di dalam SandraHub, lihat
  //      app/api/report-merge/*).
  //   2) menyisipkan header Authorization: Bearer <token sesi Supabase
  //      SandraHub yang sedang login> ke tiap panggilan itu — dibaca dari
  //      localStorage (sama origin dengan SandraHub, jadi localStorage-nya
  //      dibagi), BUKAN login terpisah. Endpoint di server yang menolak
  //      Finance MPX (lihat lib/reportMerge/auth.js) mengandalkan header
  //      ini. approve.html sengaja TIDAK butuh token sesi (dia dibuka
  //      approver lewat link email tanpa login SandraHub) — kalau token
  //      sesi tidak ada, fetch tetap jalan tanpa header itu.
  (function () {
    function findSupabaseAccessToken() {
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && /^sb-.*-auth-token$/.test(k)) {
            var raw = localStorage.getItem(k);
            if (!raw) continue;
            var parsed = JSON.parse(raw);
            var token = parsed && (parsed.access_token || (parsed.currentSession && parsed.currentSession.access_token));
            if (token) return token;
          }
        }
      } catch (e) { /* biarin, fetch tetap jalan tanpa header */ }
      return null;
    }

    var originalFetch = window.fetch.bind(window);
    window.fetch = function (input, init) {
      var url = typeof input === "string" ? input : (input && input.url) || "";
      if (url.indexOf("/api/") === 0) {
        var newUrl = "/api/report-merge" + url.slice(4);
        var token = findSupabaseAccessToken();
        var opts = Object.assign({}, init);
        if (token) {
          opts.headers = Object.assign({}, (init && init.headers) || {}, { Authorization: "Bearer " + token });
        }
        if (typeof input === "string") {
          return originalFetch(newUrl, opts);
        }
        var newReq = new Request(newUrl, input);
        return originalFetch(newReq, opts);
      }
      return originalFetch(input, init);
    };
  })();
</script>

<meta charset="UTF-8">
<title>Approval Surat</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<style>
  @font-face{
    font-family:'Indosat';
    src:url('/fonts/IndosatMedium.ttf') format('truetype');
    font-weight:500;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:'Indosat';
    src:url('/fonts/IndosatBold.ttf') format('truetype');
    font-weight:700;
    font-style:normal;
    font-display:swap;
  }
  :root{
    /* Palet resmi Indosat Ooredoo Hutchison — sama persis dengan yang dipakai
       di aplikasi utama (Brand Guidelines 1.5 / 1.6), lengkap dengan Pantone. */
    --ioh-grey:#4D4D4F;    /* Pantone 7540 C */
    --ioh-red:#ED1C24;     /* Pantone 2035 C */
    --ioh-yellow:#FFCB05;  /* Pantone 1235 C */
    --ioh-teal:#32BCAD;    /* Pantone 7465 C */
    --ioh-purple:#C6168D;  /* Pantone 675 C  */
    --ioh-pink:#EC008C;    /* Pantone 219 C  */

    --font-brand:'Indosat','Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;

    --bg:#F5F5F6; --surf:#FFFFFF; --surf2:#F7F7F8; --surf3:#F0F0F1;
    --ink:#2B2B2D; --ink2:var(--ioh-grey); --muted:#8A8A8D;
    --line:#E4E4E6;
    --red:var(--ioh-red); --yellow:var(--ioh-yellow); --teal:var(--ioh-teal);
    --purple:var(--ioh-purple); --pink:var(--ioh-pink); --gray:var(--ioh-grey);
    --teal-d:#27A093;
    --good-bg:rgba(50,188,173,.12); --good-bd:var(--ioh-teal); --good-ink:#1F8E82;
    --bad-bg:rgba(237,28,36,.10); --bad-bd:var(--ioh-red); --bad-ink:var(--ioh-red);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-brand);
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:40px 24px;
  }

  /* "Circle System" — motif latar brand yang sama dengan aplikasi utama,
     supaya halaman approval ini terasa satu keluarga. Dibuat dari
     radial-gradient, dekoratif murni. */
  .brand-bg{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .brand-bg::after{
    content:''; position:absolute; right:-190px; bottom:-200px;
    width:760px; height:760px; opacity:.11;
    background:
      radial-gradient(circle at 74% 34%, var(--ioh-pink) 0 24%, transparent 24.4%),
      radial-gradient(circle at 60% 80%, var(--ioh-purple) 0 26%, transparent 26.4%),
      radial-gradient(circle at 88% 16%, var(--ioh-yellow) 0 15%, transparent 15.4%),
      radial-gradient(circle at 33% 78%, var(--ioh-teal) 0 18%, transparent 18.4%),
      radial-gradient(circle at 55% 55%, var(--ioh-red) 0 33%, transparent 33.4%);
  }
  @media (max-width:640px){
    .brand-bg::after{ width:460px; height:460px; right:-130px; bottom:-140px; }
  }
  .card{
    position:relative; z-index:1; overflow:hidden;
    background:var(--surf); border:1px solid var(--line); border-radius:18px; padding:32px;
    max-width:680px; width:100%; box-shadow:0 10px 30px rgba(77,77,79,.10);
  }
  .card::before{
    content:''; position:absolute; top:0; left:0; right:0; height:4px;
    background:linear-gradient(90deg, var(--red), var(--pink), var(--purple), var(--teal), var(--yellow));
  }
  .brand{ display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; margin-bottom:10px; }
  .brand .dot{ width:7px; height:7px; border-radius:999px; background:var(--red); }
  .dotrow{ display:flex; gap:6px; margin-bottom:16px; }
  .dotrow span{ width:7px; height:7px; border-radius:999px; display:block; }
  h1{ font-weight:700; font-size:20px; margin:0 0 4px; line-height:1.35; color:var(--ink); }
  .sub{ color:var(--muted); font-size:13.5px; margin:0 0 22px; }

  .summary{
    background:var(--surf2); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; margin-bottom:22px;
  }
  .summary-label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin-bottom:10px; }
  .summary-grid{ display:grid; grid-template-columns:auto 1fr; row-gap:8px; column-gap:18px; font-size:13.5px; }
  .summary-grid .k{ color:var(--muted); }
  .summary-grid .v{ text-align:right; font-weight:700; color:var(--ink); }
  .summary-grid .v.big{ color:var(--pink); font-size:15.5px; }

  .items-label{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  .items-label .t{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; }
  .items-label .hint{ font-size:11.5px; color:var(--muted); }

  .items{ border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:22px; max-height:360px; overflow-y:auto; background:var(--surf); }
  .item{ display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .item:last-child{ border-bottom:none; }
  .item:nth-child(odd){ background:var(--surf2); }
  .item-seq{ color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; width:26px; flex:none; }
  .item-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
  .item-pdf{
    flex:none; color:var(--teal); text-decoration:none; font-weight:700; font-size:12.5px;
    background:rgba(50,188,173,.10); border:1px solid var(--good-bd); border-radius:8px; padding:5px 10px;
    white-space:nowrap;
  }
  .item-pdf:hover{ background:rgba(50,188,173,.2); }
  .item-nopreview{ flex:none; color:var(--muted); font-size:12px; }

  .actions{ display:flex; gap:12px; flex-wrap:wrap; }
  button{
    font-family:inherit; font-size:14px; font-weight:700; border:none; border-radius:10px;
    padding:13px 20px; cursor:pointer; flex:1; min-width:160px;
  }
  /* Tombol utama pakai teal — sama dengan tombol utama di aplikasi utama,
     sekaligus menyisakan merah brand khusus buat error/penolakan supaya
     artinya gak ketuker. Dua-duanya warna resmi brand. */
  .btn-approve{ background:var(--ioh-teal); color:#fff; }
  .btn-approve:hover{ background:var(--teal-d); }
  .btn-reject{ background:transparent; color:var(--ink2); border:1px solid var(--line); }
  .btn-reject:hover{ background:var(--surf2); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .status{ margin-top:18px; display:none; }
  .status.show{ display:block; }
  .status.err{ background:var(--bad-bg); border:1px solid var(--bad-bd); color:var(--bad-ink); padding:12px 14px; border-radius:10px; font-size:13.5px; line-height:1.5; }
  .loading, .fatal{ text-align:center; color:var(--muted); padding:20px 0; }

  .result{ text-align:center; padding:22px 18px 6px; }
  .result-icon{ width:52px; height:52px; border-radius:999px; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; font-size:24px; }
  .result.ok .result-icon{ background:var(--good-bg); border:1px solid var(--good-bd); }
  .result.err .result-icon{ background:var(--bad-bg); border:1px solid var(--bad-bd); }
  .result-title{ font-size:17px; font-weight:700; margin-bottom:8px; }
  .result.ok .result-title{ color:var(--good-ink); }
  .result.err .result-title{ color:var(--bad-ink); }
  .result-time{ font-size:13.5px; color:var(--ink2); margin-bottom:4px; }
  .result-time b{ color:var(--ink); }
  .result-extra{ font-size:12.5px; color:var(--muted); margin-top:10px; }
</style>
</head>
<body>

<!-- Motif latar "Circle System" brand Indosat — dekoratif murni. -->
<div class="brand-bg" aria-hidden="true"></div>

<div class="card" id="card">
  <div class="loading" id="loading">Memuat detail batch surat…</div>
</div>

<script>
function qs(name){
  return new URLSearchParams(window.location.search).get(name);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatRupiah(n){
  if(n === null || n === undefined || n === '' || isNaN(Number(n))) return null;
  return 'Rp ' + Math.round(Number(n)).toLocaleString('id-ID');
}

const batchId = qs('batch');
const token = qs('token');
const card = document.getElementById('card');

function renderFatal(msg){
  card.innerHTML = `<div class="fatal">⚠️ ${escapeHtml(msg)}</div>`;
}

function formatEvidence(iso){
  if(!iso) return null;
  const d = new Date(iso);
  if(isNaN(d.getTime())) return null;
  return d.toLocaleString('id-ID', { dateStyle: 'full', timeStyle: 'short' });
}

function resultHtml(status, timestamp, extra){
  const isOk = status === 'approved';
  const icon = isOk ? '✅' : '❌';
  const title = isOk ? 'Surat sudah di-approve' : 'Surat ditolak';
  const verb = isOk ? 'Disetujui' : 'Ditolak';
  const evidence = formatEvidence(timestamp);
  return `
    <div class="result ${isOk ? 'ok' : 'err'}">
      <div class="result-icon">${icon}</div>
      <div class="result-title">${title}</div>
      ${evidence ? `<div class="result-time">${verb} pada <b>${escapeHtml(evidence)}</b></div>` : ''}
      ${extra ? `<div class="result-extra">${extra}</div>` : ''}
    </div>`;
}

async function load(){
  if(!batchId || !token){
    renderFatal('Link tidak lengkap — batch atau token tidak ada di URL.');
    return;
  }
  try{
    const r = await fetch(`/api/letters/batches/${batchId}?token=${encodeURIComponent(token)}`);
    const j = await r.json();
    if(!j.ok){ renderFatal(j.error || 'Gagal memuat batch.'); return; }
    render(j.batch, j.items);
  }catch(e){
    renderFatal('Gagal terhubung ke server: ' + e.message);
  }
}

function render(batch, items){
  const letterLabel = batch.letter_name || batch.template_code;
  const totalNominalText = formatRupiah(batch.total_nominal);

  const summaryRows = [
    ['Jenis surat', escapeHtml(letterLabel)],
    batch.periode ? ['Periode', escapeHtml(batch.periode)] : null,
    ['Jumlah surat', String(items.length)],
    totalNominalText ? ['Total nominal', escapeHtml(totalNominalText), true] : null,
    ['Diajukan', new Date(batch.created_at).toLocaleString('id-ID')],
  ].filter(Boolean);

  card.innerHTML = `
    <div class="brand"><span class="dot"></span>Approval Surat</div>
    <div class="dotrow">
      <span style="background:#4D4D4F"></span>
      <span style="background:#32BCAD"></span>
      <span style="background:#C6168D"></span>
      <span style="background:#ED1C24"></span>
      <span style="background:#EC008C"></span>
      <span style="background:#FFCB05"></span>
    </div>
    <h1>📄 ${escapeHtml(letterLabel)}</h1>
    <p class="sub">Mohon direview lalu approve atau tolak untuk seluruh batch ini.</p>

    <div class="summary">
      <div class="summary-label">Ringkasan</div>
      <div class="summary-grid">
        ${summaryRows.map(([k,v,big]) => `<div class="k">${k}</div><div class="v${big?' big':''}">${v}</div>`).join('')}
      </div>
    </div>

    <div class="items-label">
      <span class="t">Surat (${items.length})</span>
      <span class="hint">klik "Buka PDF" buat review satu-satu</span>
    </div>
    <div class="items">
      ${items.map(it => `
        <div class="item">
          <span class="item-seq">${it.seq}.</span>
          <span class="item-name" title="${escapeHtml(it.filename)}">${escapeHtml(it.filename)}</span>
          ${it.previewUrl ? `<a class="item-pdf" href="${it.previewUrl}" target="_blank" rel="noopener">Buka PDF ↗</a>` : '<span class="item-nopreview">preview tidak tersedia</span>'}
        </div>`).join('')}
    </div>

    <div class="actions" id="actionsWrap">
      <button class="btn-approve" id="btnApprove">✅ Approve Semua</button>
      <button class="btn-reject" id="btnReject">❌ Tolak</button>
    </div>
    <div class="status" id="statusBox"></div>
  `;

  const statusBox = document.getElementById('statusBox');
  if(batch.status === 'approved' || batch.status === 'rejected'){
    const ts = batch.status === 'approved' ? batch.approved_at : batch.rejected_at;
    statusBox.innerHTML = resultHtml(batch.status, ts, null);
    statusBox.className = 'status show';
    document.getElementById('actionsWrap').style.display = 'none';
    return;
  }

  document.getElementById('btnApprove').addEventListener('click', () => decide('approve'));
  document.getElementById('btnReject').addEventListener('click', () => decide('reject'));
}

async function decide(action){
  const btnApprove = document.getElementById('btnApprove');
  const btnReject = document.getElementById('btnReject');
  btnApprove.disabled = true; btnReject.disabled = true;
  const statusBox = document.getElementById('statusBox');
  try{
    const r = await fetch(`/api/letters/batches/${batchId}/${action}`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ token }),
    });
    const j = await r.json();
    if(!j.ok){
      statusBox.textContent = '⚠️ ' + (j.error || 'Gagal memproses.');
      statusBox.className = 'status show err';
      btnApprove.disabled = false; btnReject.disabled = false;
      return;
    }
    const status = j.status || (action === 'approve' ? 'approved' : 'rejected');
    let extra = null;
    if(action === 'approve' && j.signature){
      if(j.signature.applied){
        extra = `Tanda tangan berhasil ditempel ke ${j.signature.stampedCount}/${j.signature.total} surat.`;
      } else if(j.signature.reason){
        extra = '⚠️ ' + escapeHtml(j.signature.reason);
      }
    }
    statusBox.innerHTML = resultHtml(status, j.timestamp || new Date().toISOString(), extra);
    statusBox.className = 'status show';
    document.getElementById('actionsWrap').style.display = 'none';
  }catch(e){
    statusBox.textContent = '⚠️ Gagal terhubung ke server: ' + e.message;
    statusBox.className = 'status show err';
    btnApprove.disabled = false; btnReject.disabled = false;
  }
}

load();
</script>
</body>
</html>
